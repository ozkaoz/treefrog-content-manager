[package]
name = "treefrog-manager"
version = "0.1.0"
description = "TreeFrog Content Manager — global TreeFrogUI SD manager (Tauri 2 + Rust)"
authors = ["TreeFrog Content Manager"]
edition = "2021"
repository = "https://github.com/ozkaoz/lgpt-r36sx-port"
license = "GPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.31", features = ["bundled"] }
walkdir = "2"
thiserror = "1"
chrono = "0.4"
tempfile = "3"
anyhow = "1"
regex = "1"
log = "0.4"
tracing = "0.1"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_WindowsProgramming"] }

# archive extras (feature-gated, keep 7z/rar via tool adapters for now)
# sevenz-rust and unrar when available — otherwise fallback to external tools

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]
