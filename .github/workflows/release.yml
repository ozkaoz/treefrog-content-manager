name: Release — TreeFrog Content Manager

on:
  push:
    tags:
      - "v*"

# The default GITHUB_TOKEN needs explicit write permission to create releases.
permissions:
  contents: write

jobs:
  build:
    name: Build executables — Windows / Linux / macOS
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows-x64
          - os: ubuntu-22.04
            platform: Linux-x64
          - os: macos-latest
            platform: macOS-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: treefrog-manager/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux system deps (webkit2gtk)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend deps
        working-directory: treefrog-manager
        run: npm ci
      - name: Build Tauri (${{ matrix.platform }})
        working-directory: treefrog-manager
        run: npx tauri build
        env:
          TFM_GIT_COMMIT: ${{ github.sha }}
      - name: Collect ONE executable per OS
        shell: pwsh
        run: |
          $version = (Get-Content treefrog-manager/package.json | ConvertFrom-Json).version
          $binDir = "treefrog-manager/src-tauri/target/release"
          New-Item -ItemType Directory -Force -Path "release-assets" | Out-Null
          if ("${{ matrix.os }}" -eq "windows-latest") {
            Copy-Item "$binDir/treefrog-manager.exe" "release-assets/TreeFrog-Content-Manager-$version-Windows-x64.exe"
          } elseif ("${{ matrix.os }}" -eq "ubuntu-22.04") {
            $appimage = Get-ChildItem "$binDir/bundle/appimage" -Filter "*.AppImage" | Select-Object -First 1
            if ($appimage) { Copy-Item $appimage.FullName "release-assets/TreeFrog-Content-Manager-$version-Linux-x64.AppImage" }
          } else {
            $dmg = Get-ChildItem "$binDir/bundle/dmg" -Filter "*.dmg" | Select-Object -First 1
            if ($dmg) { Copy-Item $dmg.FullName "release-assets/TreeFrog-Content-Manager-$version-macOS-x64.dmg" }
          }
          Get-ChildItem "release-assets"
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: exe-${{ matrix.platform }}
          path: release-assets/*
          retention-days: 5

  publish:
    name: Publish GitHub Release (latest)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - name: Download the 3 executables
        uses: actions/download-artifact@v4
        with:
          pattern: exe-*
          path: all-assets
          merge-multiple: true
      - name: Verify one executable per OS
        run: |
          ls -la all-assets/
          test -n "$(ls all-assets/*Windows-x64.exe)" || { echo "MISSING Windows exe"; exit 1; }
          test -n "$(ls all-assets/*Linux-x64.AppImage)" || { echo "MISSING Linux AppImage"; exit 1; }
          test -n "$(ls all-assets/*macOS-x64.dmg)" || { echo "MISSING macOS dmg"; exit 1; }
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: TreeFrog Content Manager ${{ github.ref_name }} (Latest)
          body: |
            # TreeFrog Content Manager ${{ github.ref_name }}

            Global SD content manager for **TreeFrogUI** handhelds — R36SX (v2.6 & v2.7), R36 HD, SF3000, SF3000 HD, SF3100, SF3500, GB350.

            ## Downloads

            | Platform | File |
            |----------|------|
            | **Windows x64** | portable `.exe` — just run it (no install) |
            | **Linux x64** | `.AppImage` |
            | **macOS x64** | `.dmg` |

            Source code: auto-generated zip/tar.gz below.

            ## What it does

            Scans your ROM, music, video, BIOS and LGPT folders, shows exactly what will be copied, and writes it to the correct TreeFrogUI folders on your SD card:
            Games → `roms/<SYSTEM>/` (75 systems, ZIP inspection, arcade payload, CUE/BIN groups) · Music → `roms/music/` (each subfolder = playlist) · Videos → `roms/videos/` (ffprobe + auto FFmpeg conversion) · BIOS → `cubegm/bios/` (validated, stock protected) · LGPT → `lgpt/samples/` + `lgpt/projects/`.

            One canonical plan: **what you preview is exactly what gets written**. Canonical path validation everywhere, collision-safe keep_both, effective-action space checks, persistent deployment history.

            ## Requirements

            - Windows 10/11 (WebView2) · Linux (WebKit2GTK 4.1) · macOS 10.15+
            - A TreeFrogUI SD card ([tzubertowski/TreeFrogUI](https://github.com/tzubertowski/TreeFrogUI) — separate project)
            - Optional: ffmpeg/ffprobe in PATH for video conversion ([ffmpeg.org](https://ffmpeg.org))

            ---
            *Independent companion tool. Does not bundle TreeFrogUI, firmware, BIOS files or copyrighted ROMs.*
          files: |
            all-assets/*
          generate_release_notes: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
