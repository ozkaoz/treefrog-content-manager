name: Validate — TreeFrog Content Manager

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call: {}

# Explicit permissions so the caller (release.yml) inherits write access for
# the publish job when this workflow is reused.
permissions:
  contents: write

jobs:
  frontend:
    name: Frontend (npm ci + typecheck + build)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: treefrog-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: treefrog-manager/package-lock.json
      - run: npm ci
      - name: Explicit type check (tsc --noEmit)
        run: npx tsc --noEmit
      - run: npm run build
      # The Rust job needs ../dist to exist (tauri-build validates frontendDist,
      # which is gitignored). Upload the built frontend for the Rust job.
      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: treefrog-manager/dist
          retention-days: 1

  rust:
    name: Rust (fmt + check + tests)
    runs-on: windows-latest
    needs: [frontend]
    defaults:
      run:
        working-directory: treefrog-manager/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # tauri-build (build.rs) requires the frontendDist directory (../dist)
      # to exist — it is gitignored, so restore the artifact built by the
      # frontend job instead of failing cargo check on a fresh checkout.
      - name: Restore frontend dist (required by tauri-build)
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: treefrog-manager/dist
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo check
        run: cargo check
      - name: cargo test (unit + security fixtures)
        run: cargo test

  python:
    name: Python (pytest incl. security + archive + BIOS traversal + video conversion)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg (video conversion + ffprobe fixtures)
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          # choco adds ffmpeg to PATH for FUTURE steps; refresh PATH now
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          ffmpeg -version | Select-Object -First 1
          ffprobe -version | Select-Object -First 1
      - name: Install pytest + Pillow (test deps)
        run: python -m pip install --upgrade pip pytest pillow
      - name: pytest
        working-directory: treefrog-manager
        run: python -m pytest tests -v

  version-consistency:
    name: Version single source of truth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cargo / package.json / tauri.conf.json must agree
        run: |
          python - <<'EOF'
          import json, re, sys
          cargo = open("treefrog-manager/src-tauri/Cargo.toml", encoding="utf-8").read()
          m = re.search(r'^version\s*=\s*"([^"]+)"', cargo, re.M)
          assert m, "Cargo.toml version missing"
          v_cargo = m.group(1)
          v_pkg = json.load(open("treefrog-manager/package.json", encoding="utf-8"))["version"]
          v_tauri = json.load(open("treefrog-manager/src-tauri/tauri.conf.json", encoding="utf-8"))["version"]
          assert v_cargo == v_pkg == v_tauri, f"version drift: cargo={v_cargo} package={v_pkg} tauri={v_tauri}"
          print(f"versions consistent: {v_cargo}")
          EOF

  build-tauri:
    name: Build Tauri artifact (packaging gate)
    runs-on: windows-latest
    needs: [frontend, rust, python, version-consistency]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: treefrog-manager/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps (npx needs @tauri-apps/cli from node_modules)
        working-directory: treefrog-manager
        run: npm ci
      - name: Build Windows x64 (Tauri)
        working-directory: treefrog-manager
        run: npx tauri build
        env:
          TFM_GIT_COMMIT: ${{ github.sha }}

  build-matrix:
    name: Build all platforms (Windows / Linux / macOS)
    runs-on: ${{ matrix.os }}
    needs: [frontend, rust, python, version-consistency]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows-x64
            ext: .exe
            bin: treefrog-manager.exe
          - os: ubuntu-22.04
            platform: Linux-x64
            ext: .AppImage
            bin: treefrog-manager
          - os: macos-latest
            platform: macOS-x64
            ext: .app.tar.gz
            bin: treefrog-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: treefrog-manager/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux system deps (webkit2gtk)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend deps
        working-directory: treefrog-manager
        run: npm ci
      - name: Build Tauri (${{ matrix.platform }})
        working-directory: treefrog-manager
        run: npx tauri build
        env:
          TFM_GIT_COMMIT: ${{ github.sha }}
      - name: Collect binary + bundles
        shell: pwsh
        run: |
          $version = (Get-Content treefrog-manager/package.json | ConvertFrom-Json).version
          $out = "dist-${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $binDir = "treefrog-manager/src-tauri/target/release"
          if ("${{ matrix.os }}" -eq "windows-latest") {
            Copy-Item "$binDir/treefrog-manager.exe" "$out/TreeFrog-Content-Manager-$version-${{ matrix.platform }}.exe"
            $nsis = Get-ChildItem "$binDir/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
            if ($nsis) { Copy-Item $nsis.FullName "$out/TreeFrog-Content-Manager-$version-${{ matrix.platform }}-Setup.exe" }
          } elseif ("${{ matrix.os }}" -eq "ubuntu-22.04") {
            $appimage = Get-ChildItem "$binDir/bundle/appimage" -Filter "*.AppImage" | Select-Object -First 1
            if ($appimage) { Copy-Item $appimage.FullName "$out/TreeFrog-Content-Manager-$version-${{ matrix.platform }}.AppImage" }
          } else {
            $dmg = Get-ChildItem "$binDir/bundle/dmg" -Filter "*.dmg" | Select-Object -First 1
            if ($dmg) { Copy-Item $dmg.FullName "$out/TreeFrog-Content-Manager-$version-${{ matrix.platform }}.dmg" }
          }
          Get-ChildItem $out
      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: TreeFrog-Content-Manager-${{ matrix.platform }}
          path: dist-${{ matrix.platform }}/*
          retention-days: 5
